spring.application.name=otp

# ------------------------------------------------------------------
# RabbitMQ
# ------------------------------------------------------------------
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=manual


# How long the producer (or our internal sendAndReceive) blocks waiting for a reply.
spring.rabbitmq.template.reply-timeout=5s

# ------------------------------------------------------------------
# Redis
# ------------------------------------------------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2s

# ------------------------------------------------------------------
# OTP consumer tuning
# ------------------------------------------------------------------
# Concurrency range: min-max consumers per queue.
# Total threads = sum across all @RabbitListener methods × max.
otp.rabbit.min-concurrency=2
otp.rabbit.max-concurrency=8
# QoS prefetch per consumer.
otp.rabbit.prefetch=10
otp.rabbit.exchange=otp.exchange
otp.rabbit.dlx=otp.exchange.dlx
otp.rabbit.request.queue=otp.request
otp.rabbit.request.routing-key=otp.request
otp.rabbit.request.dlq=otp.request.dlq
otp.rabbit.verify.queue=otp.request
otp.rabbit.verify.routing-key=otp.request
otp.rabbit.verify.dlq=otp.request.dlq
# Challenge TTL in seconds (matches OtpChallengeRepository.TTL).
otp.challenge.ttl-seconds=120


# ------------------------------------------------------------------
# Jackson
# ------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
